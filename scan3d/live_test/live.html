<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D 스캔 시험</title>
<style>
  html, body { margin: 0; height: 100%; background: #1d1f23; color: #e8e8e8; font: 15px system-ui, sans-serif; }
  #side { position: absolute; top: 0; left: 0; bottom: 0; width: 360px; overflow-y: auto; padding: 12px; box-sizing: border-box;
          background: #25282d; border-right: 1px solid #3a3e45; }
  #view { position: absolute; top: 0; left: 360px; right: 0; bottom: 0; }
  #c { width: 100%; height: 100%; display: block; }
  h1 { font-size: 18px; margin: 0 0 10px; }
  #phase { font-size: 22px; font-weight: 700; padding: 10px; border-radius: 8px; background: #33373e; margin-bottom: 6px; }
  #msg { min-height: 2.6em; opacity: .9; }
  button { font: inherit; padding: 8px 14px; border-radius: 8px; border: 0; cursor: pointer; }
  #stop { width: 100%; font-size: 26px; font-weight: 800; padding: 18px; background: #d92d2d; color: #fff; margin: 10px 0; }
  #stop:active { background: #a81f1f; }
  #start { background: #2f8f4e; color: #fff; }
  #start:disabled, #replay:disabled { opacity: .4; cursor: default; }
  select { font: inherit; background: #33373e; color: #e8e8e8; border: 1px solid #555; border-radius: 6px; padding: 4px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 6px 0; }
  .box { background: #2c3036; border-radius: 8px; padding: 8px; margin: 8px 0; }
  #bar { height: 10px; background: #444; border-radius: 5px; overflow: hidden; }
  #bar > div { height: 100%; width: 0; background: #4aa3ff; }
  #log { font: 12px ui-monospace, monospace; white-space: pre-wrap; max-height: 220px; overflow-y: auto; opacity: .85; }
  small { opacity: .7; }
  #info { position: absolute; left: 10px; bottom: 8px; opacity: .8; font-size: 13px; }
  @media (max-width: 800px) { #side { position: static; width: auto; } #view { position: relative; left: 0; height: 70vh; } }
</style>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
               "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
<div id="side">
  <h1>3D 스캔 시험 (맵 모드)</h1>
  <div id="phase">…</div>
  <div id="msg"></div>
  <button id="stop" title="녹화 중: 폰 카메라 끄고 찍은 만큼 메시로 만듦 · 가져오는 중: 취소 · 노트북 작업 중: 멈추고 만든 데까지 가져옴">■ 멈춤 (STOP)</button>
  <div class="box">
    <div class="row">
      <button id="start">▶ 시작</button>
      <label>길이 <select id="secs"><option>20</option><option selected>30</option><option>45</option><option>60</option></select> 초</label>
    </div>
    <div class="row"><label>영상 <select id="kbps">
      <option value="160000" selected>160 Mbps (검증된 기본)</option>
      <option value="40000">40 Mbps (전송 4배 빠름, 미검증)</option></select></label></div>
    <small>폰 화면 안내: 가만히 → 천천히 둘러보기 → 가만히 → 자동 멈춤. 처음엔 폰을 바닥/책상에 둔 채 시작.</small>
  </div>
  <div class="box" id="pullbox" style="display:none">
    <div id="pulltxt"></div><div id="bar"><div></div></div>
  </div>
  <div class="box">
    <div class="row">결과 메시 <select id="meshes" style="max-width:220px"></select></div>
    <div class="row"><label><input type="checkbox" id="wire"> 선만</label> <button id="reset">시점 처음으로</button></div>
  </div>
  <div class="box">
    <div class="row"><small>폰 없이 시험 (PC 에 있는 녹화본)</small></div>
    <div class="row"><select id="recs" style="max-width:220px"></select><button id="replay">만들기</button></div>
  </div>
  <div class="box"><div id="log"></div></div>
</div>
<div id="view"><canvas id="c"></canvas><div id="info"></div></div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { PLYLoader } from "three/addons/loaders/PLYLoader.js";
const $ = id => document.getElementById(id);
const NAMES = { idle: "대기", preflight: "준비 확인", starting: "카메라 켜는 중", recording: "● 녹화 중", stopping: "멈추는 중",
  pulling: "PC 로 가져오는 중", building: "노트북에서 메시 만드는 중", done: "완료", failed: "실패", canceled: "멈춤 (취소)" };
const COLORS = { recording: "#b3261e", done: "#2f6f3e", failed: "#7a2a2a", building: "#2b4f7a", pulling: "#2b4f7a" };
const post = (u, b) => fetch(u, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(b || {}) })
  .then(r => r.json()).then(d => { if (d.msg) $("msg").textContent = d.msg; });
$("stop").onclick = () => post("/api/stop");
$("start").onclick = () => { if (confirm("폰 카메라를 켜고 녹화를 시작할까요?")) post("/api/start", { secs: +$("secs").value, kbps: +$("kbps").value }); };
$("replay").onclick = () => { if ($("recs").value) post("/api/replay", { rec: $("recs").value }); };
const fmt = s => s == null ? "-" : `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
let lastMesh = null;
async function tick() {
  try {
    const s = await (await fetch("/api/state")).json();
    const busy = !["idle", "done", "failed", "canceled"].includes(s.phase);
    $("phase").textContent = (NAMES[s.phase] || s.phase) + (s.phase === "recording" ? `  ${fmt(s.elapsed)} / ${fmt(s.secs)}` : "");
    $("phase").style.background = COLORS[s.phase] || "#33373e";
    $("msg").textContent = s.msg + (s.temp ? ` · 폰 배터리 ${s.temp} °C` : "") + (s.link ? ` · 연결 ${s.link}` : "") + (s.rec ? ` · ${s.rec}` : "");
    $("start").disabled = busy; $("replay").disabled = busy;
    const p = s.pull;
    $("pullbox").style.display = p && s.phase === "pulling" ? "" : "none";
    if (p) { $("pulltxt").textContent = `${(p.done / 1e6).toFixed(0)} / ${(p.total / 1e6).toFixed(0)} MB · ${(p.rate / 1e6).toFixed(2)} MB/s · 남은 ${p.eta ? fmt(p.eta) : "?"}`;
             $("bar").firstElementChild.style.width = (100 * p.done / Math.max(1, p.total)).toFixed(1) + "%"; }
    $("log").textContent = s.log.slice().reverse().join("\n");
    if (s.mesh && s.mesh !== lastMesh) { lastMesh = s.mesh; await listMeshes(); load(s.mesh); }
  } catch (e) { $("phase").textContent = "서버 연결 끊김"; }
}
async function listMeshes() {
  const m = await (await fetch("/api/meshes")).json(), sel = $("meshes"), cur = sel.value;
  sel.innerHTML = ""; for (const x of m) sel.appendChild(new Option(`${x.t} · ${x.rec} (${x.mb} MB)`, x.url));
  if (cur) sel.value = cur;
}
async function listRecs() {
  const r = await (await fetch("/api/recordings")).json();
  $("recs").innerHTML = ""; for (const x of r.reverse()) $("recs").appendChild(new Option(x, x));
}
// ---- mesh view (world = VIO frame, z = up / gravity) ----
const renderer = new THREE.WebGLRenderer({ canvas: $("c"), antialias: true });
renderer.setPixelRatio(devicePixelRatio);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x1d1f23);
const cam = new THREE.PerspectiveCamera(50, 1, 0.01, 100); cam.up.set(0, 0, 1);
const ctl = new OrbitControls(cam, renderer.domElement); ctl.enableDamping = true;
scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.2));
const dl = new THREE.DirectionalLight(0xffffff, 0.8); dl.position.set(1, -1, 2); scene.add(dl);
scene.add(new THREE.AxesHelper(0.2));
let obj = null, home = null;
function resize() { const v = $("view"), w = v.clientWidth, h = v.clientHeight; renderer.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); }
addEventListener("resize", resize); resize();
function load(url) {
  $("info").textContent = "메시 불러오는 중… " + url;
  new PLYLoader().load(url, g => {
    g.computeVertexNormals();
    const mat = new THREE.MeshStandardMaterial({ vertexColors: g.hasAttribute("color"), side: THREE.DoubleSide, roughness: .9, wireframe: $("wire").checked });
    if (obj) { scene.remove(obj); obj.geometry.dispose(); }
    obj = new THREE.Mesh(g, mat); scene.add(obj);
    g.computeBoundingBox(); const bb = g.boundingBox, c = bb.getCenter(new THREE.Vector3()), r = bb.getSize(new THREE.Vector3()).length();
    home = { c, p: c.clone().add(new THREE.Vector3(r * 0.5, -r * 0.5, r * 0.4)) };
    cam.position.copy(home.p); ctl.target.copy(c); ctl.update();
    const sz = bb.getSize(new THREE.Vector3());
    $("info").textContent = `${(g.attributes.position.count / 1000).toFixed(0)} k 꼭짓점 · 크기 ${sz.x.toFixed(2)} × ${sz.y.toFixed(2)} × ${sz.z.toFixed(2)} m (VIO 축척, 수 % 오차) · 왼쪽 = 돌리기 · 오른쪽 = 옮기기 · 휠 = 확대`;
  }, ev => { if (ev.total) $("info").textContent = `메시 받는 중 ${(100 * ev.loaded / ev.total).toFixed(0)} %`; },
     e => $("info").textContent = "못 읽음: " + url + " (" + e + ")");
}
$("meshes").onchange = e => load(e.target.value);
$("wire").onchange = e => { if (obj) obj.material.wireframe = e.target.checked; };
$("reset").onclick = () => { if (home) { cam.position.copy(home.p); ctl.target.copy(home.c); ctl.update(); } };
renderer.setAnimationLoop(() => { ctl.update(); renderer.render(scene, cam); });
await listMeshes(); listRecs();
if ($("meshes").value) { load($("meshes").value); }
tick(); setInterval(tick, 1500);
</script>
</body>
</html>
